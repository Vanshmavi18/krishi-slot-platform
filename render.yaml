# render.yaml - 1-Click Free 24/7 Cloud Deployment
services:
  - type: web
    name: krishi-slot-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
