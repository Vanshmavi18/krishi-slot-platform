# render.yaml - 1-Click Free 24/7 Cloud Deployment
services:
  - type: web
    name: agriqueue
    env: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node server/index.js
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_OPTIONS
        value: --dns-result-order=ipv4first
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: AgriQueue <onboarding@resend.dev>
      - key: MONGODB_URI
        sync: false
